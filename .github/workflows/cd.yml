name: News Aggregator CD

# Kích hoạt khi có code mới được merge/push vào nhánh main
on:
  push:
    branches: [ main ]

# Cấp quyền cho GitHub Token để đẩy Docker Image lên GitHub Packages (GHCR)
permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    steps:
      # Bước 1: Kéo code về máy ảo
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # Bước 2: Cài đặt Docker Buildx (công cụ build Docker hiện đại)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Bước 3: Đăng nhập vào GitHub Container Registry (ghcr.io)
      # Tiện lợi: Dùng sẵn GITHUB_TOKEN mặc định của GitHub, không cần tạo tài khoản hay nhập mật khẩu phụ
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Bước 4: Tạo thẻ (tags) cho Docker Image: latest và git commit SHA
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      # Bước 5: Build Docker Image và Push lên Registry
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max